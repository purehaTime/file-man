[package]
name = "file-man"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Lightweight Wayland file manager with no GTK/Qt dependencies"
license = "MIT"

[[bin]]
name = "file-man"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "wayland",
    "x11",
    "crisp",
    "web-colors",
    "thread-pool",
    "svg",
    "lazy",
    "fira-sans",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
